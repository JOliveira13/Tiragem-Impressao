<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiragem Semanal Impressão</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--bd:#e2e5ea;--a:#2563eb;--b:#f59e0b;--bad:#dc2626}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mu:#98a2b3;--bd:#2c333d;--a:#5b8cff;--b:#fbbf24;--bad:#f87171}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111418;--card:#1a1f26;--tx:#e8ebef;--mu:#98a2b3;--bd:#2c333d;--a:#5b8cff;--b:#fbbf24;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 2px}h2{font-size:15px;margin:0 0 10px}
.sub{color:var(--mu);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}
.bar label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
select,input{font:inherit;padding:6px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}
.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--mu)}
.row{display:grid;grid-template-columns:90px 1fr 110px;gap:10px;align-items:center;margin:6px 0}
.trk{background:var(--bg);border-radius:6px;height:20px;overflow:hidden}
.fill{height:100%;background:var(--a);border-radius:6px}
.row .v{text-align:right;font-variant-numeric:tabular-nums}
.sc{overflow-x:auto}
tr.ok td{background:rgba(22,163,74,.16)}tr.bad td{background:rgba(220,38,38,.16)}
#to table{font-size:12px}
#to th,#to td{padding:6px 5px;white-space:normal;vertical-align:top}
#to td.n,#to th.n,#to td:first-child,#to td:nth-child(3){white-space:nowrap}
#to td:nth-child(2){min-width:130px}
tr.ok td:first-child{color:#16a34a;font-weight:600}tr.bad td:first-child{color:var(--bad);font-weight:600}
#wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.info.sub{grid-column:1/-1;font-size:13px;color:var(--mu)}
.wk{border:1px solid var(--bd);border-radius:14px;padding:16px;background:var(--bg)}
.wk .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:18px}
.chip{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu)}.chip.ok{background:#16a34a;border-color:#16a34a;color:#fff}
.wk .mid{display:flex;gap:18px;align-items:center}
.wk svg{flex:none;width:130px;height:130px}
.wk .st{display:grid;gap:8px;flex:1}.wk .st span{display:block;font-size:12px;color:var(--mu)}.wk .st b{font-size:21px;font-variant-numeric:tabular-nums}
.wk .days{display:flex;gap:4px;align-items:flex-end;height:78px;margin-top:14px}
.wk .dc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;line-height:1.2;color:var(--mu);text-align:center}
.wk .dc i{display:block;width:100%;background:var(--a);opacity:.85;border-radius:4px 4px 0 0;min-height:2px;margin-bottom:3px}
.wk .note{font-size:13px;color:var(--mu);margin-top:10px}.wk .note b{color:var(--tx)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--mu);cursor:pointer;user-select:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--mu);padding:8px 0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:700px){.cols{grid-template-columns:1fr}}
</style>
</head>

  var h='<table><thead><tr>'+cols.map(function(c){return'<th class="'+(c.n?'n':'')+'" data-t="'+id+'" data-k="'+c.k+'">'+c.l+(st.k===c.k?(st.dir<0?' ↓':' ↑'):'')+'</th>'}).join('')+'</tr></thead><tbody>';
  data.forEach(function(r){h+='<tr class="'+(rc?rc(r):'')+'">'+cols.map(function(c){return'<td class="'+(c.n?'n':'')+'">'+esc(c.f?c.f(r[c.k],r):r[c.k])+'</td>'}).join('')+'</tr>'});
  $(id).innerHTML=h+'</tbody></table>'
}
var WM=['R908','XL105'],wkCur=0;
var WEEKS=[{l:'W44 · 25/10 22:00 a 01/11 06:00',s:'2026-10-25',st:1320,e:'2026-11-01',et:360,t:{R908:570000,XL105:576000}},{l:'W43 · 19/10 a 25/10',s:'2026-10-19',st:0,e:'2026-10-25',et:1440,t:{R908:786000,XL105:609000}}];
function addDays(d,n){var t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
function absMin(d,t){return Date.parse(d+'T00:00:00Z')/60000+t}
function weekly(){
  var w=WEEKS[wkCur],a0=absMin(w.s,w.st),a1=absMin(w.e,w.et),h='';
  ['R908','XL105','Total'].forEach(function(m){
    var tgt=m==='Total'?(w.t.R908||0)*2+(w.t.XL105||0):(w.t[m]||0);
    var P=rows.filter(function(r){var x=absMin(r.d,r.t);return r.e==='P'&&(m==='Total'||r.m===m)&&x>=a0&&x<=a1});
    var got=P.reduce(function(a,r){return a+r.q*(m==='Total'&&r.m==='R908'?2:1)},0),miss=Math.max(tgt-got,0),pct=tgt?got/tgt*100:0;
    var days=[];for(var d=w.s,n=0;d<=w.e&&n<14;d=addDays(d,1),n++)days.push(d);
    var dq=days.map(function(d){return P.filter(function(r){return r.d===d}).reduce(function(a,r){return a+r.q*(m==='Total'&&r.m==='R908'?2:1)},0)}),dmx=Math.max.apply(null,dq.concat([1]));
    var C=339.3,ok=pct>=100,col=ok?'#16a34a':'var(--a)';
    var chip=!tgt?'<span class="chip">Sem objetivo</span>':ok?'<span class="chip ok">Objetivo atingido</span>':'<span class="chip">Em curso</span>';
    var note='';
    if(!tgt)note='Objetivo desta semana ainda não definido.';
    else if(got>tgt)note='Excedido em <b>'+nf(got-tgt)+' FL</b>.';
    else if(got===tgt)note='Objetivo cumprido na perfeição.';
    else{var last=P.length?Math.max.apply(null,P.map(function(r){return absMin(r.d,r.t)})):a0;var rem=Math.round((a1-last)/1440);note=rem>0?'Para chegar ao objetivo: <b>'+nf(miss/rem)+' FL/dia</b> nos '+rem+' dias restantes.':'Faltam <b>'+nf(miss)+' FL</b> para o objetivo.'}
    var dh=days.map(function(d,k){var wd=['D','S','T','Q','Q','S','S'][new Date(d+'T00:00:00Z').getUTCDay()];return'<div class="dc" title="'+fd(d)+': '+nf(dq[k])+' FL"><i style="height:'+(dq[k]/dmx*52)+'px"></i>'+wd+'<br>'+d.slice(8)+'</div>'}).join('');
    h+='<div class="wk"><div class="h"><b>'+(m==='Total'?'Total R908 + XL105':m)+'</b>'+chip+'</div><div class="mid"><svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="54" fill="none" stroke="var(--bd)" stroke-width="14"/><circle cx="65" cy="65" r="54" fill="none" stroke="'+col+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+(Math.min(pct,100)/100*C)+' '+C+'" transform="rotate(-90 65 65)"/><text x="65" y="73" text-anchor="middle" font-size="26" font-weight="700" fill="var(--tx)">'+(tgt?Math.round(pct)+'%':'–')+'</text></svg><div class="st"><div><span>Alcançado</span><b style="color:'+col+'">'+nf(got)+' FL</b></div><div><span>Falta alcançar</span><b>'+(tgt?nf(miss)+' FL':'–')+'</b></div><div><span>Objetivo</span><b>'+(tgt?nf(tgt)+' FL':'–')+'</b></div></div></div><div class="days">'+dh+'</div><div class="note">'+note+'</div></div>'
  });
  $('wk').innerHTML=h+'<div class="info sub">'+w.l+' · conta as folhas das palets criadas nesse período, independentemente dos filtros abaixo. No total, a R908 conta ×2 (tiragem e objetivo).</div>'
}
function render(){weekly();
  var d=$('fd').value,m=$('fm').value,t=$('ft').value;
  var f=rows.filter(function(r){return(!d||r.d===d)&&(!m||r.m===m)&&(!t||shift(r.t)===t)});
  var P=f.filter(function(r){return r.e==='P'}),S=f.filter(function(r){return r.e==='S'});
  var tot=P.reduce(function(a,r){return a+r.q},0),stopS=S.reduce(function(a,r){return a+r.s},0);
  $('k').innerHTML=[['Tiragem total',nf(tot)+' FL'],['Palets criadas',nf(P.length)],['Média por palete',P.length?nf(tot/P.length)+' FL':'–'],['Tempo em paragens',hm(stopS)],['Nº de paragens',nf(S.length)]].map(function(x){return'<div class="kpi"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('');
  var by={};
  f.forEach(function(r){var o=by[r.m]||(by[r.m]={m:r.m,q:0,pal:0,ps:0,np:0,up:0});if(r.e==='P'){o.q+=r.q;o.pal++;o.up+=r.q/(VEL[r.m]||Infinity)}else{o.ps+=r.s;o.np++}});
  var ms=Object.keys(by).map(function(k){var o=by[k];o.avg=o.pal?o.q/o.pal:0;return o}),mx=Math.max.apply(null,ms.map(function(o){return o.q}).concat([1]));
  $('ch').innerHTML=ms.length?ms.sort(function(a,b){return b.q-a.q}).map(function(o){return'<div class="row"><b>'+esc(o.m)+'</b><div class="trk"><div class="fill" style="width:'+(o.q/mx*100)+'%"></div></div><div class="v">'+nf(o.q)+'</div></div>'}).join(''):'<div class="empty">Sem dados.</div>';
  var qo={};P.forEach(function(r){var k=r.m+'|'+r.o;qo[k]=(qo[k]||0)+r.q});
  ms.forEach(function(o){var sq=0,ss=0;Object.keys(qo).forEach(function(k){var p=k.split('|');if(p[0]!==o.m)return;var sp=spanH(p[1],o.m,d,t);if(sp>0){sq+=qo[k];ss+=sp}});o.up=ss?sq/ss:-1;o.v=VEL[o.m]||0});
  table('tm',[{k:'m',l:'Máquina'},{k:'q',l:'Tiragem (FL)',n:1,f:nf},{k:'pal',l:'Palets',n:1},{k:'avg',l:'Média/palete',n:1,f:nf},{k:'up',l:'Uptime realizado (FL/h)',n:1,f:function(v){return v<0?'–':nf(v)}},{k:'v',l:'Objetivo (FL/h)',n:1,f:nf},{k:'np',l:'Paragens',n:1},{k:'ps',l:'Tempo parado',n:1,f:hm}],ms,'q',function(r){return(r.up<0||!r.v)?'':r.up>=r.v?'ok':'bad'});
  var bd={};P.forEach(function(r){var k=r.d+'|'+r.m,o=bd[k]||(bd[k]={d:r.d,m:r.m,q:0,pal:0});o.q+=r.q;o.pal++});
  table('td',[{k:'d',l:'Dia',f:fd},{k:'m',l:'Máquina'},{k:'q',l:'Tiragem (FL)',n:1,f:nf},{k:'pal',l:'Palets',n:1}],Object.keys(bd).map(function(k){return bd[k]}),'d');
  var bo={};f.forEach(function(r){var k=r.o+'|'+r.m,o=bo[k]||(bo[k]={o:r.o,p:r.p,m:r.m,q:0,pal:0,ps:0});if(r.e==='P'){o.q+=r.q;o.pal++}else o.ps+=r.s});
  var bol=Object.keys(bo).map(function(k){var o=bo[k],v=VEL[o.m],sp=spanH(o.o,o.m,d,t);o.sp=sp==null?-1:sp;o.up=sp>0?o.q/sp:-1;o.pct=(o.up>=0&&v)?o.up/v*100:-1;o.v=v||0;return o});
  table('to',[{k:'o',l:'Ordem'},{k:'p',l:'Produto'},{k:'m',l:'Máquina'},{k:'q',l:'Tiragem (FL)',n:1,f:nf},{k:'pal',l:'Palets',n:1},{k:'sp',l:'Duração',n:1,f:function(v){return v<0?'–':hm(v*3600)}},{k:'up',l:'Uptime (FL/h)',n:1,f:function(v){return v<0?'–':nf(v)}},{k:'v',l:'Obj. (FL/h)',n:1,f:nf},{k:'pct',l:'vs obj.',n:1,f:function(v){return v<0?'–':v.toFixed(0)+' %'}},{k:'ps',l:'Parado',n:1,f:hm}],bol.filter(function(o){return!$('fo').value||o.m===$('fo').value}),'q',function(r){return r.pct<0?'':r.pct>=100?'ok':'bad'});
  var bm={},pm=WM.slice();
  S.forEach(function(r){if(pm.indexOf(r.m)<0)pm.push(r.m);var k=r.mo||'(sem motivo)',o=bm[k]||(bm[k]={mo:k,n:0,s:0});o.n++;o.s+=r.s;o['n_'+r.m]=(o['n_'+r.m]||0)+1;o['s_'+r.m]=(o['s_'+r.m]||0)+r.s});
  if(m)pm=pm.filter(function(x){return x===m});
  var pc=[{k:'mo',l:'Motivo'}];
  pm.forEach(function(x){pc.push({k:'s_'+x,l:x+' · tempo (nº)',n:1,f:function(v,r){return v?hm(v)+' ('+r['n_'+x]+')':'–'}})});
  pc.push({k:'s',l:'Total · tempo (nº)',n:1,f:function(v,r){return hm(v)+' ('+r.n+')'}});
  var pd=Object.keys(bm).map(function(k){var o=bm[k];pm.forEach(function(x){o['s_'+x]=o['s_'+x]||0});return o});
  table('tp',pc,pd,'s')
}
document.addEventListener('click',function(e){var th=e.target.closest&&e.target.closest('th[data-t]');if(!th)return;var s=sortS[th.dataset.t];s.dir=s.k===th.dataset.k?-s.dir:-1;s.k=th.dataset.k;render()});
